syntax = "proto3";

package hibiki.pb;

option java_package = "hibiki.pb";
option java_outer_classname = "HibikiProto";

// ─── Shared Data Messages ──────────────────────────────────────────
//
// Reusable data types referenced by both Request and Notification
// messages, as well as project persistence (Project/TrackSave).

// A single control point on an automation curve.
// Points are ordered by time_beats ascending within a lane.
// The engine interpolates between consecutive points using
// a power-curve controlled by `tension`.
message AutomationPoint {
  float time_beats = 1; // Position in beats (quarter notes from song start)
  float value = 2;      // Normalized parameter value, clamped to [0.0, 1.0]
  float tension = 3;    // Curve shape between this point and the next:
                         //   0 = linear
                         //  >0 = ease-in  (slow departure, fast arrival)
                         //  <0 = ease-out (fast departure, slow arrival)
                         // Internally mapped via t' = t^(2^tension)
}

// A single MIDI note-on/note-off event pair.
// Tick values are absolute positions relative to the clip start,
// using the resolution defined in the containing message
// (e.g. ClipMidiData.resolution or UpdateClipMidi.resolution).
message MidiEvent {
  int64 tick = 1;            // Absolute tick position (PPQ-based)
  int32 pitch = 2;           // MIDI note number [0, 127]
  int64 duration_ticks = 3;  // Note length in ticks (note-off = tick + duration_ticks)
  int32 velocity = 4;        // Note-on velocity [0, 127]
}

// ─── Request Messages (GUI → Engine) ────────────────────────────────
//
// Sent from the Java/Clojure GUI to the C++ engine via IPC.
// Each request is wrapped in a `Request.command` oneof.
// The engine processes requests synchronously on the IPC thread
// and may send back Notification messages asynchronously.

// Load a VST3 plugin onto a track's plugin chain.
// If the track doesn't exist yet, it is created automatically.
// Triggers: ParamList notification on success.
message LoadPlugin {
  int32 track_index = 1;   // Target track (0-based, auto-created if needed)
  string path = 2;         // Filesystem path to .vst3 bundle
  int32 plugin_index = 3;  // Sub-plugin index within multi-plugin bundle (usually 0)
}

// Load a media file (MIDI or audio) into a session clip slot.
// The engine auto-detects MIDI vs audio from the file extension.
// Triggers: ClipInfo + ClipWaveform notifications on success.
message LoadClip {
  int32 track_index = 1;  // Target track
  int32 slot_index = 2;   // Session grid slot (0-based)
  string path = 3;        // Filesystem path to .mid, .wav, .mp3, .ogg, .flac, .aiff
  bool is_loop = 4;       // Whether the clip should loop during playback
}

// Toggle looping for an existing session clip.
message SetClipLoop {
  int32 track_index = 1;
  int32 slot_index = 2;
  bool is_loop = 3;
}

// Start global timeline playback from the current playhead position.
// Triggers: periodic PlayheadInfo notifications.
message Play {}

// Stop all playback (both session clips and timeline).
// Resets per-track playback state.
message Stop {}

// Launch a single session clip for playback.
message PlayClip {
  int32 track_index = 1;
  int32 slot_index = 2;
}

// Stop playback on a specific track (session mode).
message StopTrack {
  int32 track_index = 1;
}

// Open the native plugin GUI window (VST3 editor).
// On Linux this creates an X11 child window; on macOS a Cocoa view.
message ShowPluginGui {
  int32 track_index = 1;
  int32 plugin_index = 2;  // Index in the track's plugin chain
}

// Set a plugin parameter to a specific value.
// This is the primary way the GUI communicates knob/slider changes.
message SetParamValue {
  int32 track_index = 1;
  int32 plugin_index = 2;
  uint32 param_id = 3;     // VST3 parameter ID (from ParamInfo.id)
  float value = 4;         // Normalized value [0.0, 1.0]
}

// Remove a plugin from a track's plugin chain.
// Shifts subsequent plugins down by one index.
// Triggers: updated ParamList notifications for remaining plugins.
message RemovePlugin {
  int32 track_index = 1;
  int32 plugin_index = 2;
}

// Serialize the entire project state to disk as a protobuf binary.
// Triggers: Acknowledge notification.
message SaveProject {
  string path = 1;  // Output .hbk file path
}

// Load a project from disk, replacing all current state.
// Triggers: ClearProject, then a series of ClipInfo/ParamList/TrackInfo
// notifications to rebuild the GUI state.
message LoadProjectCmd {
  string path = 1;  // Input .hbk file path
}

// Change the global tempo. Affects MIDI playback speed and
// beat↔second conversions for timeline positioning.
message SetBpm {
  float bpm = 1;  // Beats per minute (typically 20–300)
}

// Launch all clips in a scene (column) of the session grid.
// Equivalent to calling PlayClip for every track at the given slot.
message PlayScene {
  int32 slot_index = 1;
}

// Delete a clip from a session slot, freeing its resources.
// Triggers: Acknowledge notification.
message DeleteClip {
  int32 track_index = 1;
  int32 slot_index = 2;
}

// Shut down the engine process cleanly.
message Quit {}

// Scan a VST3 bundle and enumerate available sub-plugins.
// Triggers: PluginList notification with discovered plugin descriptions.
message ListPlugins {
  string path = 1;  // Path to .vst3 bundle directory
}

// Render the entire project to a WAV file offline.
// Triggers: BounceFinished notification when complete.
message BounceProjectCmd {
  string path = 1;  // Output .wav file path
}

// Undo the last undoable action (project state snapshot restore).
// Triggers: ClearProject + full state re-sync notifications.
message Undo {}

// Redo a previously undone action.
// Triggers: ClearProject + full state re-sync notifications.
message Redo {}

// Place a clip on the timeline at a specific beat position.
// If duration_beats is 0, the engine auto-detects from the file.
// Triggers: TimelineClipInfo notification on success.
message AddTimelineClip {
  int32 track_index = 1;
  string path = 2;            // Media file path
  float start_time = 3;       // Start position in seconds
  float duration_beats = 4;   // Length in beats (0 = auto-detect from file)
}

// Remove a clip from the timeline by its index.
message RemoveTimelineClip {
  int32 track_index = 1;
  int32 clip_index = 2;  // Index in track's timeline_clips vector
}

// Move the playhead to a specific position.
// Triggers: PlayheadInfo notification.
message Seek {
  float position = 1;  // Target position in seconds
}

// Change the duration of an existing timeline clip.
message ResizeTimelineClip {
  int32 track_index = 1;
  int32 clip_index = 2;
  float duration_beats = 3;  // New duration in beats
}

// Request MIDI event data for a clip (used by Piano Roll editor).
// Exactly one of slot_index or clip_index should be >= 0;
// the other should be -1 to indicate "not used".
// Triggers: ClipMidiData notification.
message GetClipMidi {
  int32 track_index = 1;
  int32 slot_index = 2;   // Session slot (-1 = use clip_index instead)
  int32 clip_index = 3;   // Timeline clip (-1 = use slot_index instead)
}

// Write updated MIDI data back to a clip (from Piano Roll edits).
// Replaces all existing events in the clip.
// Triggers: Acknowledge notification.
message UpdateClipMidi {
  int32 track_index = 1;
  int32 slot_index = 2;
  int32 clip_index = 3;
  int32 resolution = 4;           // Ticks per quarter note (PPQ)
  repeated MidiEvent events = 5;  // Complete replacement event list
}

// Create an automation lane binding a plugin parameter to a curve.
// Triggers: AutomationLanesData notification.
message AddAutomationLane {
  int32 track_index = 1;
  int32 plugin_index = 2;
  uint32 param_id = 3;
}

// Delete an automation lane by index.
// Triggers: AutomationLanesData notification.
message RemoveAutomationLane {
  int32 track_index = 1;
  int32 lane_index = 2;
}

// Replace all automation points in a lane.
// Points should be sorted by time_beats ascending.
// Triggers: AutomationLanesData notification.
message UpdateAutomationLane {
  int32 track_index = 1;
  int32 lane_index = 2;
  repeated AutomationPoint points = 3;
}

// Request current automation lane data for a track.
// Triggers: AutomationLanesData notification.
message GetAutomationLanes {
  int32 track_index = 1;
}

// Top-level request envelope.
// The GUI sends one Request per IPC round-trip.
// The engine dispatches on the `command` oneof case.
message Request {
  oneof command {
    LoadPlugin load_plugin = 1;
    LoadClip load_clip = 2;
    Play play = 3;
    Stop stop = 4;
    PlayClip play_clip = 5;
    StopTrack stop_track = 6;
    ShowPluginGui show_plugin_gui = 7;
    SetParamValue set_param_value = 8;
    RemovePlugin remove_plugin = 9;
    SaveProject save_project = 10;
    LoadProjectCmd load_project = 11;
    SetClipLoop set_clip_loop = 12;
    SetBpm set_bpm = 13;
    PlayScene play_scene = 14;
    DeleteClip delete_clip = 15;
    Quit quit = 16;
    ListPlugins list_plugins = 17;
    Undo undo = 18;
    Redo redo = 19;
    AddTimelineClip add_timeline_clip = 20;
    RemoveTimelineClip remove_timeline_clip = 21;
    Seek seek = 22;
    BounceProjectCmd bounce_project = 23;
    GetClipMidi get_clip_midi = 24;
    UpdateClipMidi update_clip_midi = 25;
    ResizeTimelineClip resize_timeline_clip = 26;
    AddAutomationLane add_automation_lane = 27;
    RemoveAutomationLane remove_automation_lane = 28;
    UpdateAutomationLane update_automation_lane = 29;
    GetAutomationLanes get_automation_lanes = 30;
  }
}

// ─── Notification Messages (Engine → GUI) ───────────────────────────
//
// Pushed asynchronously from the C++ engine to all registered
// notification listeners in the GUI. Each notification is wrapped
// in a `Notification.response` oneof.

// Plugin parameter metadata, sent after a plugin is loaded or
// after undo/redo restores state. Used to populate the PluginPane UI.
message ParamInfo {
  uint32 id = 1;            // VST3 parameter ID (stable across sessions)
  string name = 2;          // Human-readable parameter name
  float default_value = 3;  // Factory default [0.0, 1.0]
}

// Full parameter list for a loaded plugin.
// Sent as a notification after LoadPlugin or project load.
message ParamList {
  int32 track_index = 1;
  int32 plugin_index = 2;
  string plugin_name = 3;   // Display name (e.g. "Dexed")
  bool is_instrument = 4;   // true if plugin is a VSTi (generates audio)
  repeated ParamInfo params = 5;
}

// Engine log message (debug/info/error output).
message Log {
  string message = 1;
}

// Generic command acknowledgement.
message Acknowledge {
  string command_type = 1;  // Name of the command that was acknowledged
  bool success = 2;
}

// Session clip metadata, sent when a clip is loaded into a slot
// or when project state is re-synced after undo/load.
message ClipInfo {
  int32 track_index = 1;
  int32 slot_index = 2;
  string name = 3;   // Display name (usually filename without extension)
  string path = 4;   // Full filesystem path to source file
}

// Signals that the project has been cleared (before a load or undo).
// The GUI should reset all track/clip/plugin state when received.
message ClearProject {}

// Per-track audio level metering data.
// Sent periodically (~30Hz) during playback for VU meter display.
message TrackLevel {
  int32 track_index = 1;
  float peak_l = 2;  // Left channel peak [0.0, 1.0]
  float peak_r = 3;  // Right channel peak [0.0, 1.0]
}

// Batch of track levels, sent as a single notification per meter tick.
message TrackLevels {
  repeated TrackLevel levels = 1;
}

// Downsampled waveform data for a session clip, used for
// visual display in the clip slot. Typically ~200 samples.
message ClipWaveform {
  int32 track_index = 1;
  int32 slot_index = 2;
  repeated float waveform = 3;  // Normalized peak values for display
}

// Description of a sub-plugin within a VST3 bundle.
// Part of the PluginList response to a ListPlugins request.
message PluginDescription {
  int32 index = 1;    // Sub-plugin index within the bundle
  string name = 2;    // Plugin name (e.g. "Dexed")
  string vendor = 3;  // Vendor name (e.g. "Digital Suburban")
}

// List of available sub-plugins in a scanned VST3 bundle.
// Sent in response to a ListPlugins request.
message PluginList {
  string path = 1;                        // Bundle path that was scanned
  repeated PluginDescription plugins = 2;
}

// Metadata for a clip placed on the timeline.
// Sent when a timeline clip is added, or during project re-sync.
message TimelineClipInfo {
  int32 track_index = 1;
  int32 clip_index = 2;
  string name = 3;
  string path = 4;
  float start_time = 5;           // Position in seconds
  float duration = 6;             // Duration in seconds (for display)
  repeated float waveform = 7;    // Downsampled waveform for display
}

// Transport state, sent periodically (~30Hz) during playback
// and once after Seek/Play/Stop commands.
message PlayheadInfo {
  float position_sec = 1;  // Current playhead position in seconds
  float bpm = 2;           // Current tempo
  bool is_playing = 3;     // Whether transport is running
}

// Track name metadata, sent during project re-sync.
message TrackInfo {
  int32 track_index = 1;
  string name = 2;
}

// Offline bounce completion notification.
message BounceFinished {
  string path = 1;     // Output file path
  bool success = 2;
}

// MIDI event data for a clip, sent in response to GetClipMidi.
// Used by the Piano Roll editor to populate its note grid.
message ClipMidiData {
  int32 track_index = 1;
  int32 slot_index = 2;   // -1 if this is a timeline clip
  int32 clip_index = 3;   // -1 if this is a session clip
  int32 resolution = 4;   // Ticks per quarter note (PPQ)
  repeated MidiEvent events = 5;
}

// A single automation lane's full state.
message AutomationLaneInfo {
  int32 track_index = 1;
  int32 lane_index = 2;
  int32 plugin_index = 3;
  uint32 param_id = 4;
  string param_name = 5;  // Cached from ParamInfo for display
  repeated AutomationPoint points = 6;
}

// All automation lanes for a track.
// Sent in response to GetAutomationLanes, AddAutomationLane,
// RemoveAutomationLane, or UpdateAutomationLane requests.
message AutomationLanesData {
  int32 track_index = 1;
  repeated AutomationLaneInfo lanes = 2;
}

// Top-level notification envelope.
// The engine pushes one Notification per event.
// GUI listeners dispatch on the `response` oneof case.
message Notification {
  oneof response {
    ParamList param_list = 1;
    Log log = 2;
    Acknowledge acknowledge = 3;
    ClipInfo clip_info = 4;
    ClearProject clear_project = 5;
    TrackLevels track_levels = 6;
    ClipWaveform clip_waveform = 7;
    PluginList plugin_list = 8;
    TimelineClipInfo timeline_clip_info = 9;
    PlayheadInfo playhead_info = 10;
    BounceFinished bounce_finished = 11;
    TrackInfo track_info = 12;
    ClipMidiData clip_midi_data = 13;
    AutomationLanesData automation_lanes_data = 14;
  }
}

// ─── Project Persistence ────────────────────────────────────────────
//
// Messages used exclusively for serializing project state to disk.
// The Project message is the top-level container written to .hbk files.
//
// NOTE: These are separate from runtime IPC messages because the save
// format captures static state (parameter snapshots) while IPC messages
// carry live/transient data (waveforms, meter levels).
// A future redesign may unify these with the runtime data entities.

// Saved parameter value snapshot.
message ParameterSave {
  uint32 id = 1;     // VST3 parameter ID
  float value = 2;   // Saved normalized value [0.0, 1.0]
}

// Saved plugin instance state.
message PluginSave {
  string path = 1;                       // .vst3 bundle path
  int32 index = 2;                       // Sub-plugin index within bundle
  repeated ParameterSave parameters = 3; // All parameter values at save time
}

// Clip media type discriminator.
enum ClipType {
  MIDI = 0;
  AUDIO = 1;
}

// Saved session clip state.
message ClipSave {
  int32 slot_index = 1;   // Session grid slot
  string path = 2;        // Source file path
  bool is_loop = 3;       // Loop enabled flag
  ClipType type = 4;      // MIDI or AUDIO
}

// Saved timeline clip placement.
message TimelineClipSave {
  string path = 1;        // Source file path
  float start_time = 2;   // Position in seconds
  float duration = 3;     // Duration in seconds
}

// Saved automation lane with all curve points.
message AutomationLaneSave {
  int32 plugin_index = 1;                // Target plugin in chain
  uint32 param_id = 2;                   // Target parameter ID
  repeated AutomationPoint points = 3;   // Reuses shared AutomationPoint
}

// Saved track state including all plugins, clips, and automation.
message TrackSave {
  int32 index = 1;                                // Track index
  string name = 2;                                // User-defined name
  repeated PluginSave plugins = 3;                // Plugin chain
  repeated ClipSave clips = 4;                    // Session clips
  repeated TimelineClipSave timeline_clips = 5;   // Timeline clips
  repeated AutomationLaneSave automation_lanes = 6; // Automation curves
}

// Top-level project container.
// This is the root message serialized to .hbk project files.
message Project {
  float bpm = 1;                   // Global tempo
  float playhead_pos = 2;          // Last playhead position in seconds
  repeated TrackSave tracks = 3;   // All tracks
}
