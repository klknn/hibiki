// Command messages sent from the GUI to the C++ engine.
//
// This file contains both:
//   - New domain-grouped commands (TransportCmd, TrackCmd, etc.)
//   - Legacy per-verb commands for incremental migration
//
// The legacy commands mirror the old hibiki.proto messages so the
// codebase can migrate namespaces first, then semantics second.

syntax = "proto3";

package hibiki.pb.commands;

option java_package = "hibiki.pb.commands";
option java_outer_classname = "CommandsProto";
option java_multiple_files = true;

import "pb/core.proto";

// ─── New Domain-Grouped Commands ────────────────────────────────────

message TransportCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_PLAY = 1;
    ACTION_STOP = 2;
    ACTION_SEEK = 3;
  }
  Action action = 1;
  float seek_pos = 2;
  uint32 scene_index = 3;
}

message TrackCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_PLAY_SLOT = 1;
    ACTION_STOP = 2;
    ACTION_LOAD_CLIP = 3;
    ACTION_DELETE_CLIP = 4;
    ACTION_SET_CLIP_LOOP = 5;
    ACTION_ADD_TIMELINE_CLIP = 6;
    ACTION_REMOVE_TIMELINE_CLIP = 7;
    ACTION_RESIZE_TIMELINE_CLIP = 8;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  hibiki.pb.core.Clip clip_data = 3;
  float value = 4;
  bool flag = 5;
}

message PluginCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_LOAD = 1;
    ACTION_REMOVE = 2;
    ACTION_SHOW_GUI = 3;
    ACTION_SET_PARAM = 4;
    ACTION_LIST = 5;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  string path = 3;
  uint32 param_id = 4;
  float param_value = 5;
}

message AutomationCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ADD_LANE = 1;
    ACTION_REMOVE_LANE = 2;
    ACTION_UPDATE_POINTS = 3;
    ACTION_GET_LANES = 4;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  uint32 param_id = 3;
  repeated hibiki.pb.core.AutomationPoint points = 4;
}

message MidiCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_GET = 1;
    ACTION_UPDATE = 2;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  uint32 resolution = 3;
  repeated hibiki.pb.core.MidiEvent events = 4;
}

message ProjectCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_SAVE = 1;
    ACTION_LOAD = 2;
    ACTION_BOUNCE = 3;
    ACTION_UNDO = 4;
    ACTION_REDO = 5;
    ACTION_QUIT = 6;
    ACTION_SET_BPM = 7;
  }
  Action action = 1;
  string path = 2;
  float bpm = 3;
}

// ─── Legacy Per-Verb Commands ───────────────────────────────────────
// These mirror the old hibiki.proto request messages for incremental
// migration. They will eventually be replaced by the new domain commands.

message LoadPlugin {
  int32 track_index = 1;
  string path = 2;
  int32 plugin_index = 3;
}

message LoadClip {
  int32 track_index = 1;
  int32 slot_index = 2;
  string path = 3;
  bool is_loop = 4;
}

message SetClipLoop {
  int32 track_index = 1;
  int32 slot_index = 2;
  bool is_loop = 3;
}

message Play {}
message Stop {}

message PlayClip {
  int32 track_index = 1;
  int32 slot_index = 2;
}

message StopTrack {
  int32 track_index = 1;
}

message ShowPluginGui {
  int32 track_index = 1;
  int32 plugin_index = 2;
}

message SetParamValue {
  int32 track_index = 1;
  int32 plugin_index = 2;
  uint32 param_id = 3;
  float value = 4;
}

message RemovePlugin {
  int32 track_index = 1;
  int32 plugin_index = 2;
}

message SaveProject {
  string path = 1;
}

message LoadProjectCmd {
  string path = 1;
}

message SetBpm {
  float bpm = 1;
}

message PlayScene {
  int32 slot_index = 1;
}

message DeleteClip {
  int32 track_index = 1;
  int32 slot_index = 2;
}

message Quit {}

message ListPlugins {
  string path = 1;
}

message BounceProjectCmd {
  string path = 1;
}

message Undo {}
message Redo {}

message AddTimelineClip {
  int32 track_index = 1;
  string path = 2;
  float start_time = 3;
  float duration_beats = 4;
}

message RemoveTimelineClip {
  int32 track_index = 1;
  int32 clip_index = 2;
}

message Seek {
  float position = 1;
}

message ResizeTimelineClip {
  int32 track_index = 1;
  int32 clip_index = 2;
  float duration_beats = 3;
}

message GetClipMidi {
  int32 track_index = 1;
  int32 slot_index = 2;
  int32 clip_index = 3;
}

message UpdateClipMidi {
  int32 track_index = 1;
  int32 slot_index = 2;
  int32 clip_index = 3;
  int32 resolution = 4;
  repeated hibiki.pb.core.MidiEvent events = 5;
}

message AddAutomationLane {
  int32 track_index = 1;
  int32 plugin_index = 2;
  uint32 param_id = 3;
}

message RemoveAutomationLane {
  int32 track_index = 1;
  int32 lane_index = 2;
}

message UpdateAutomationLane {
  int32 track_index = 1;
  int32 lane_index = 2;
  repeated hibiki.pb.core.AutomationPoint points = 3;
}

message GetAutomationLanes {
  int32 track_index = 1;
}

// ─── Request Envelope ───────────────────────────────────────────────

// Legacy request envelope with per-verb commands.
// Contains both new domain-grouped and legacy per-verb commands.
message Request {
  oneof command {
    // New domain-grouped commands
    TransportCmd transport = 40;
    TrackCmd track = 41;
    PluginCmd plugin = 42;
    AutomationCmd automation = 43;
    MidiCmd midi = 44;
    ProjectCmd project = 45;

    // Legacy per-verb commands
    LoadPlugin load_plugin = 1;
    LoadClip load_clip = 2;
    Play play = 3;
    Stop stop = 4;
    PlayClip play_clip = 5;
    StopTrack stop_track = 6;
    ShowPluginGui show_plugin_gui = 7;
    SetParamValue set_param_value = 8;
    RemovePlugin remove_plugin = 9;
    SaveProject save_project = 10;
    LoadProjectCmd load_project = 11;
    SetClipLoop set_clip_loop = 12;
    SetBpm set_bpm = 13;
    PlayScene play_scene = 14;
    DeleteClip delete_clip = 15;
    Quit quit = 16;
    ListPlugins list_plugins = 17;
    Undo undo = 18;
    Redo redo = 19;
    AddTimelineClip add_timeline_clip = 20;
    RemoveTimelineClip remove_timeline_clip = 21;
    Seek seek = 22;
    BounceProjectCmd bounce_project = 23;
    GetClipMidi get_clip_midi = 24;
    UpdateClipMidi update_clip_midi = 25;
    ResizeTimelineClip resize_timeline_clip = 26;
    AddAutomationLane add_automation_lane = 27;
    RemoveAutomationLane remove_automation_lane = 28;
    UpdateAutomationLane update_automation_lane = 29;
    GetAutomationLanes get_automation_lanes = 30;
  }
}
