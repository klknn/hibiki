// Command messages sent from the GUI to the C++ engine.
//
// This file contains both:
//   - New domain-grouped commands (TransportCmd, TrackCmd, etc.)
//   - Legacy per-verb commands for incremental migration
//
// The legacy commands mirror the old hibiki.proto messages so the
// codebase can migrate namespaces first, then semantics second.

syntax = "proto3";

package hibiki.pb.commands;

option java_package = "hibiki.pb.commands";
option java_outer_classname = "CommandsProto";
option java_multiple_files = true;

import "pb/core.proto";

// ─── New Domain-Grouped Commands ────────────────────────────────────

message TransportCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_PLAY = 1;
    ACTION_STOP = 2;
    ACTION_SEEK = 3;
    ACTION_RECORD = 4;
  }
  Action action = 1;
  float seek_pos = 2;
  uint32 scene_index = 3;
}

message TrackCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_PLAY_SLOT = 1;
    ACTION_STOP = 2;
    ACTION_LOAD_CLIP = 3;
    ACTION_DELETE_CLIP = 4;
    ACTION_SET_CLIP_LOOP = 5;
    ACTION_ADD_TIMELINE_CLIP = 6;
    ACTION_REMOVE_TIMELINE_CLIP = 7;
    ACTION_RESIZE_TIMELINE_CLIP = 8;
    ACTION_ARM_RECORD = 9;
    ACTION_SET_INPUT_DEVICE = 10;
    ACTION_SET_MIDI_INPUT = 11;
    ACTION_SET_RECORD_MODE = 12;
    ACTION_SET_VOLUME = 13;
    ACTION_SET_PAN = 14;
    ACTION_SET_MUTE = 15;
    ACTION_SET_SOLO = 16;
    ACTION_MOVE_TIMELINE_CLIP = 17;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  hibiki.pb.core.Clip clip_data = 3;
  float value = 4;
  bool flag = 5;
  string input_device_id = 6;
  uint32 input_channel_start = 7;   // 0-based start channel
  bool input_stereo = 8;            // mono or stereo
  string midi_input_device_id = 9;  // MIDI input device ID
  int32 record_mode = 10;           // 0 = audio, 1 = MIDI
  int32 target_track_index = 11;    // For cross-track clip moves
}

message PluginCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_LOAD = 1;
    ACTION_REMOVE = 2;
    ACTION_SHOW_GUI = 3;
    ACTION_SET_PARAM = 4;
    ACTION_LIST = 5;
    ACTION_GET_EDITOR_FRAME = 6;
    ACTION_SEND_EDITOR_INPUT = 7;
    ACTION_STOP_GUI = 8;
    ACTION_LOAD_SAMPLE = 9;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  string path = 3;
  uint32 param_id = 4;
  float param_value = 5;
  // Editor input fields (for ACTION_SEND_EDITOR_INPUT)
  int32 input_type = 6;  // 0=move, 1=down, 2=up, 3=key_down, 4=key_up, 5=wheel
  int32 input_x = 7;
  int32 input_y = 8;
  int32 input_button = 9;
  int32 input_key = 10;
  int32 input_delta = 11;
  string remote_host = 12;     // if set, load via TCP to this "host:port"
  repeated string paths = 13;  // batch bundle paths for ACTION_LIST
  string sample_path = 14;     // WAV path for ACTION_LOAD_SAMPLE (Sampler)
}

message AutomationCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ADD_LANE = 1;
    ACTION_REMOVE_LANE = 2;
    ACTION_UPDATE_POINTS = 3;
    ACTION_GET_LANES = 4;
    ACTION_ADD_CLIP = 5;
    ACTION_REMOVE_CLIP = 6;
    ACTION_MOVE_CLIP = 7;
    ACTION_RESIZE_CLIP = 8;
    ACTION_RENAME_CLIP = 9;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  uint32 param_id = 3;
  repeated hibiki.pb.core.AutomationPoint points = 4;
  uint32 clip_index = 5;
  float start_time_sec = 6;
  float duration_beats = 7;
  string clip_name = 8;
}

message MidiCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_GET = 1;
    ACTION_UPDATE = 2;
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;
  uint32 resolution = 3;
  repeated hibiki.pb.core.MidiEvent events = 4;
}

message ProjectCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_SAVE = 1;
    ACTION_LOAD = 2;
    ACTION_BOUNCE = 3;
    ACTION_UNDO = 4;
    ACTION_REDO = 5;
    ACTION_QUIT = 6;
    ACTION_SET_BPM = 7;
  }
  Action action = 1;
  string path = 2;
  float bpm = 3;
}

// ─── Settings ───────────────────────────────────────────────────────

enum PluginHostMode {
  PLUGIN_HOST_IN_PROCESS = 0;
  PLUGIN_HOST_LOCAL_SANDBOX = 1;
}

message SetPluginHostMode {
  PluginHostMode mode = 1;  // in-process or sandbox (for local plugins)
  repeated string remote_hosts = 2;  // always stored, independent of mode
}

message ScanRemotePlugins {
  repeated string remote_hosts = 1;  // daemons to query for plugin lists
}

message SetAudioBufferSize {
  int32 buffer_size_ms = 1;  // audio buffer latency in milliseconds
}

// Persisted to .hibikirc.textproto in the working directory.
message HibikiConfig {
  PluginHostMode plugin_host_mode = 1;
  repeated string remote_hosts = 2;
  int32 buffer_latency_ms = 3;
}

// Request to list available audio input devices.
message ListAudioInputs {}

// Request to list available MIDI input devices.
message ListMidiInputs {}

// Send a live virtual MIDI event (from PC keyboard or on-screen piano).
message SendVirtualMidi {
  int32 track_index = 1;
  uint32 note = 2;      // MIDI note number [0, 127]
  uint32 velocity = 3;  // Note-on velocity [0, 127]
  bool note_on = 4;     // true = note-on, false = note-off
}

message ModulationCmd {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_ADD = 1;        // Add modulator to a device slot
    ACTION_REMOVE = 2;     // Remove modulator from slot
    ACTION_CONFIGURE = 3;  // Update waveform/rate/depth/sync
    ACTION_ASSIGN = 4;     // Assign modulator to target param
  }
  Action action = 1;
  hibiki.pb.core.EntityRef target = 2;  // track + plugin index
  int32 slot_index = 3;                 // 0-2 modulator slot
  int32 waveform = 4;                   // 0=sin, 1=saw, 2=square, 3=random
  float rate_hz = 5;           // LFO frequency (Hz, or beats if synced)
  float depth = 6;             // -1.0 to 1.0
  uint32 target_param_id = 7;  // assigned parameter ID
  bool sync_to_tempo = 8;      // if true, rate is in beat divisions
}

// ─── Request Envelope ───────────────────────────────────────────────

// Contains the new domain-grouped commands.
message Request {
  oneof command {
    TransportCmd transport = 40;
    TrackCmd track = 41;
    PluginCmd plugin = 42;
    AutomationCmd automation = 43;
    MidiCmd midi = 44;
    ProjectCmd project = 45;
    SetPluginHostMode set_plugin_host_mode = 46;
    ScanRemotePlugins scan_remote_plugins = 47;
    SetAudioBufferSize set_audio_buffer_size = 48;
    ListAudioInputs list_audio_inputs = 49;
    ListMidiInputs list_midi_inputs = 50;
    SendVirtualMidi send_virtual_midi = 51;
    ModulationCmd modulation = 52;
  }
}
