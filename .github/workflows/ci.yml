name: CI

on:
  push:
    branches: [main, experimental, refactor-gui]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: Linux (x64)
          - os: macos-latest
            name: macOS (x64)
          - os: windows-latest
            name: Windows (x64)

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # Install platform-specific dependencies
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcursor-dev

      # Cache Bazel build artifacts
      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Cache Bazel (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:/Users/runneradmin/_bazel_runneradmin
          key: bazel-windows-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-windows-

      # Build
      - name: Build
        run: bazel build -c opt --enable_platform_specific_config //:hibiki-gui-java

      # Test
      - name: Run tests
        run: bazel test -c opt --enable_platform_specific_config //:all --test_output=all

      # Coverage (Linux only — generates LCOV for Codecov)
      - name: Run coverage
        if: runner.os == 'Linux'
        run: bazel coverage -c opt --enable_platform_specific_config :all --combined_report=lcov

      - name: Upload to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v5
        with:
          files: bazel-out/_coverage/_coverage_report.dat
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
